findings:
  - id: VIS-DFV2-024-01
    component: house rug overlay
    route: DEV house MapScene
    symptom: initial candidate rug depth covered the player near the entry
    classification: outlier
    valid_variant: false
    approved_exception: false
    root_cause:
      source: src/presentation/scenes/MapScene.ts
      style: null
      token: null
      mechanism: rug was inserted at actor foreground depth instead of ground depth
    fix: added rug to the ground container below actors
    status: fixed
  - id: VIS-DFV2-024-02
    component: farm field autotile
    route: DEV farm MapScene
    symptom: fully connected field tiles showed repeated grass corner holes
    classification: outlier
    valid_variant: false
    approved_exception: false
    root_cause:
      source: docs/art/candidates/pixel-movement/gate1-world-v2-scene/farm/generate.mjs
      style: null
      token: null
      mechanism: full-neighbor field mask left corner pixels transparent to the grass base
    fix: full-neighbor mask now fills the complete tile with soil
    status: fixed
  - id: VIS-DFV2-024-03
    component: ground/object MapScene layers
    route: DEV farm and house MapScene
    symptom: wall and furniture candidates could be selected for both the opaque ground image and the object image
    classification: outlier
    valid_variant: false
    approved_exception: false
    root_cause:
      source: src/presentation/scenes/MapScene.ts
      style: null
      token: null
      mechanism: candidate frame selection inferred layer from base tile kind and dropped the renderer layer argument
    fix: renderer depth now selects explicit ground/object mapping; house floor remains under walls and furniture
    status: fixed
  - id: VIS-DFV2-024-05
    component: house wall window placement
    route: DEV house MapScene
    symptom: the candidate window appeared both in the wall tile and as a manifest overlay at an inconsistent position
    classification: outlier
    valid_variant: false
    approved_exception: false
    root_cause:
      source: src/presentation/scenes/MapScene.ts
      style: null
      token: null
      mechanism: legacy wall tiles and candidate wall accessory placement both rendered the window
    fix: removed wall-top and wall-window from layoutSuggestion overlays; the MapDef wall tile mapping is the single source of window position
    status: fixed
  - id: VIS-DFV2-024-04
    component: house furniture layout
    route: DEV house MapScene
    symptom: multi-tile furniture used legacy symbol cells as single-tile anchors and overlapped
    classification: outlier
    valid_variant: false
    approved_exception: false
    root_cause:
      source: src/presentation/scenes/MapScene.ts
      style: null
      token: null
      mechanism: multi-tile frames ignored manifest layoutSuggestion placements and foot anchors
    fix: render manifest placements with per-frame footAnchor; validate placement anchors against legacy house map bounds
    status: fixed

