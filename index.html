<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="晨露農場：原創農場生活網頁遊戲（垂直切片 MVP）。" />
    <title>晨露農場</title>
  </head>
  <body>
    <main class="app">
      <header class="status" aria-label="遊戲狀態">
        <span id="hud-day">第 1 年 春 第 1 天</span>
        <span id="hud-clock">06:00</span>
        <span id="hud-weather" aria-label="天氣與明天的預報"></span>
        <button id="hud-skills" class="skills" type="button" aria-label="技能等級，點一下打開技能與天賦（或按 K）"></button>
        <span id="hud-gold">0 金</span>
        <span class="energy" aria-label="體力">
          <span class="energy-track"><span id="hud-energy-fill"></span></span>
          <span id="hud-energy-text">20 / 20</span>
        </span>
        <span id="hud-tool">鋤頭</span>
        <span id="hud-seed"></span>
        <span id="hud-mine" aria-label="礦坑狀態"></span>
      </header>
      <div id="game" class="stage"></div>
      <section id="shop-panel" class="shop-panel" aria-labelledby="shop-title" hidden>
        <header>
          <h2 id="shop-title"></h2>
          <p id="shop-funds"></p>
        </header>
        <ul id="shop-list" class="shop-list"></ul>
        <button id="shop-close" type="button">離開櫃檯（Esc）</button>
      </section>
      <section id="kitchen-panel" class="shop-panel" aria-labelledby="kitchen-title" hidden>
        <header>
          <h2 id="kitchen-title">廚房</h2>
          <p id="kitchen-funds"></p>
        </header>
        <ul id="kitchen-list" class="shop-list"></ul>
        <button id="kitchen-close" type="button">離開廚房（Esc）</button>
      </section>
      <section id="workbench-panel" class="shop-panel" aria-labelledby="workbench-title" hidden>
        <header>
          <h2 id="workbench-title">工作台</h2>
          <p id="workbench-funds"></p>
        </header>
        <ul id="workbench-list" class="shop-list"></ul>
        <button id="workbench-close" type="button">離開工作台（Esc）</button>
      </section>
      <section id="workshop-panel" class="shop-panel" aria-labelledby="workshop-title" hidden>
        <header>
          <h2 id="workshop-title">加工台</h2>
          <p id="workshop-funds"></p>
        </header>
        <ul id="workshop-list" class="shop-list"></ul>
        <button id="workshop-close" type="button">離開加工台（Esc）</button>
      </section>
      <section id="skill-panel" class="shop-panel" aria-labelledby="skill-title" hidden>
        <header>
          <h2 id="skill-title">技能與天賦</h2>
          <p id="skill-summary"></p>
        </header>
        <ul id="skill-list" class="shop-list"></ul>
        <button id="skill-close" type="button">離開（Esc）</button>
      </section>
      <section id="resident-panel" class="shop-panel" aria-labelledby="resident-title" hidden>
        <header>
          <h2 id="resident-title">居民與好感</h2>
          <p id="resident-summary"></p>
        </header>
        <ul id="resident-list" class="shop-list"></ul>
        <button id="resident-close" type="button">離開（Esc）</button>
      </section>
      <section id="quest-panel" class="shop-panel" aria-labelledby="quest-title" hidden>
        <header>
          <h2 id="quest-title">委託與佈告欄</h2>
          <p id="quest-summary"></p>
        </header>
        <ul id="quest-list" class="shop-list"></ul>
        <button id="quest-close" type="button">離開（Esc）</button>
      </section>
      <section id="heart-event-panel" class="shop-panel" aria-labelledby="heart-event-title" hidden>
        <header>
          <h2 id="heart-event-title"></h2>
        </header>
        <div id="heart-event-body" class="heart-event-body"></div>
        <ul id="heart-event-options" class="shop-list"></ul>
        <button id="heart-event-next" type="button">下一頁</button>
      </section>
      <section class="panel" aria-label="訊息">
        <ul id="hud-log" class="log" aria-live="polite"></ul>
        <p class="help">方向鍵移動 · X 互動 · Z 切換工具 · C 切換種子 · A 斧頭 · P 鎬 · R 釣竿 · G 鐮刀 · K 技能與天賦 · F 居民與好感 · J 委託與佈告欄 · S 存檔 · B 背景音樂 · M 靜音</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
